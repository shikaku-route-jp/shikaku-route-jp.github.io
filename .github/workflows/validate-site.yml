name: Validate site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate static site
        run: python scripts/validate_site.py
      - name: Check exam schedule freshness
        run: python scripts/check_exam_dates.py
